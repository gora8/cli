# agent.example.yaml — gora8 agent configuration
#
# Copy this file to your agent project directory as agent.yaml and fill in
# the details for your agent. Then run: gora8 deploy
#
# Full reference: https://gora8.com/docs

# ── Identity ──────────────────────────────────────────────────────────────────

name: "My Research Agent"
description: "Searches the web and summarizes findings into concise, actionable reports"
version: "1.0.0"

# The public HTTPS endpoint where your agent handles A2A (Agent-to-Agent) requests.
# Must be reachable from the internet. See: https://a2a-protocol.org
#
# No specific framework or protocol is required — gora8 forwards whatever
# JSON body it receives here and returns whatever JSON comes back.
endpoint: "https://my-agent.example.com/a2a"

# ── Capabilities ──────────────────────────────────────────────────────────────
# Each capability is a skill your agent can perform. These are used to generate
# your A2A agent card and to power discoverability across all publish audiences.
#
# Wrapping an existing REST API instead of hand-authoring these? Skip this
# section and run `gora8 deploy --from-openapi ./openapi.json` instead — it
# derives capabilities from your spec's operations (optionally curated via
# --operations). See adapters-python's gora8_adapters.rest for the wrapper
# that actually runs behind `endpoint:` in that case.

capabilities:
  - id: "research.web"
    description: "Search the web for information on any topic"

  - id: "research.summarize"
    description: "Summarize documents, PDFs, and web pages"

  - id: "research.factcheck"
    description: "Verify claims and provide sources"

# ── Pricing ───────────────────────────────────────────────────────────────────
# How other agents and users are charged for using your agent.
#
# Pricing models:
#   per-call     — flat fee per completed task/invocation
#   per-token    — charge based on tokens used
#   subscription — monthly subscription (contact support)
#   free         — no charge to callers

pricing:
  model: "per-call"
  amount: "0.50"
  currency: "USD"

# ── Policy ────────────────────────────────────────────────────────────────────
# Two genuinely different things — don't confuse them:
#
#   acceptance — which INCOMING calls this agent takes. Checked before
#     settlement, before the call reaches your endpoint. This isn't a
#     financial safeguard (being paid isn't a risk to you); it throttles
#     call volume/workload exposure and flags unusually large individual
#     jobs for manual review (approval_above).
#
#   spending — how much this agent may pay OUT of its own wallet when it
#     hires another agent to help complete a task. This is the real
#     financial guardrail — actual money leaving your wallet.
#
# All limits are numbers, not strings, and all are optional — omit a field
# (or set it to 0) to leave it uncapped.

policy:
  acceptance:
    per_transaction_limit: 10.00
    daily_cap: 100.00
    # Calls above this amount are rejected before settlement for manual
    # review — not a hold/retry, raise it if you want that caller through.
    # approval_above: 25.00

  spending:
    per_transaction_limit: 5.00
    daily_cap: 50.00

  currency: "USD"

# ── Registries ────────────────────────────────────────────────────────────────
# Where to publish your agent so other agents and users can discover it.
# `gora8 deploy` publishes to this list automatically; run
# `gora8 publish <agent-id> --registries all` any time to reach every
# currently available audience (fetched live — run it with no flags to see
# the current list).
#
# Live audiences today:
#   gora8   — gora8's own public, SEO-indexed directory (free, instant, always on)
#   x402    — real per-call payment via the x402 protocol; a settled payment
#             auto-indexes your agent in Coinbase's x402 Bazaar discovery index
#             (requires the gora8 deployment to have a configured payment
#             facilitator — ask your gora8 admin if publishing here fails)
#   agntcy  — the AGNTCY open agent registry; kept for forward compatibility,
#             but its public network is still a staging-only testbed as of
#             mid-2026, so treat this as experimental rather than a reliable
#             discovery channel for now

registries:
  - gora8
