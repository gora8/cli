[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gora8-adapters"
version = "0.1.0"
description = "Wrap LangGraph, CrewAI, OpenAI Agents SDK, Google ADK, Agno, Semantic Kernel, or AutoGen agents as gora8-deployable HTTP servers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Pablo Guillen" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.80"]
openai-agents = ["openai-agents>=0.19"]
google-adk = ["google-adk>=2.0"]
agno = ["agno>=2.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
autogen = ["autogen-agentchat>=0.6", "autogen-ext>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/gora8_adapters"]
